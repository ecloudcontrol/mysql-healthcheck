app:
  name: mysql-healthcheck
  code: ECSWEB
  notify: ti-alerts@ecloudcontrol.com

build:
  version: 3.11
  env: PROD
  build_file: none
  output_files: output/*.zip
  image_template: mysqlhealthcheck-0.01

deploy:
  context: alpha/PROD
  replicas: 1
  port:
  - 5000

  

properties:
  MYSQL_HOST : "10.10.52.15"
  MYSQL_PORT : 3306
  MYSQL_DATABASE : "mydb"
  MYSQL_USER : "web_client"
  MYSQL_PASSWORD:
     vault: MYSQL_PASSWORD
  revision : 82
