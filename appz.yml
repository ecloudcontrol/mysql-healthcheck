app:
  name: mysql-healthcheck
  code: ECSWEB
  notify: ti-alerts@ecloudcontrol.com

build:
  version: 3.11
  env: PROD
  build_file: none
  output_files: output/*.zip
  image_template: python:3.11

deploy:
  context: ecloudcontrol/PROD
  type: statefulset
  ingress: none
  replicas: 1
  resources: x-large
  port:
  - 443

  

properties:
  MYSQL_HOST : "172.20.22.64:3306"
  MYSQL_DATABASE : "mydb"
  MYSQL_USER : "web_client"
  MYSQL_PASSWORD:
     vault: MYSQL_PASSWORD
  revision : 84
